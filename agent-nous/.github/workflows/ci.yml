name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/agent-nous-dist" .
      - name: Check distribution hygiene
        run: python scripts/check_distribution.py --wheel "$RUNNER_TEMP/agent-nous-dist/$(ls "$RUNNER_TEMP/agent-nous-dist")"
