name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The runtime has no mandatory dependencies. Pytest is the declared
      # optional test tool; no secrets or provider credentials are used here.
      - name: Install test extra
        run: python -m pip install --disable-pip-version-check --no-input ".[test]"

      - name: Compile source and tests
        run: python -B scripts/validate_compile.py

      - name: Run tests
        run: python -B -m pytest -q -p no:cacheprovider

      - name: Bootstrap validation
        run: python scripts/validate_bootstrap.py .

  build-smoke:
    name: Build smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Do not resolve or install dependencies. This only exercises the
      # already available setuptools/wheel build backend and cannot use the net.
      - name: Build wheel without dependency resolution
        run: python -m pip wheel --no-deps --no-build-isolation --no-index --wheel-dir "$RUNNER_TEMP/nous-pilot-dist" .
